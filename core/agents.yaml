# omo-bridge / core / agents.yaml
#
# 平台无关的「纪律型 Agent」定义。借鉴 oh-my-openagent (OMO) 的 11 Agent 理念，
# 但仅保留概念与职责，不含任何 OMO 源码。
#
# 字段说明：
#   id              : agent 唯一标识
#   name            : 展示名（沿用 OMO 概念命名以致敬）
#   role            : 角色类型 (orchestrator | worker | planner | reviewer | searcher | vision)
#   default_category: 默认任务类别，由 categories.yaml 路由到具体模型（由 adapter 映射）
#   needs_tools     : 是否需要工具调用通道 (edit/bash/read/grep 等)
#                     true  → 只能绑「有 tools 能力」的模型
#                     false → 可绑「仅推理」模型当只读顾问
#   description     : 职责一句话
#
# 各 adapter 负责把这里的抽象定义落地成平台原生形态
# (DSH: cordis agent-preset; WorkBuddy: Skill; Trae: rules 块)。

version: 1
agents:
  - id: sisyphus
    name: Sisyphus
    role: orchestrator
    default_category: orchestrator
    needs_tools: true
    description: 主编排器。规划、委派、驱动任务完成，不半途而废。

  - id: hephaestus
    name: Hephaestus
    role: worker
    default_category: deep
    needs_tools: true
    description: 自主深度工人。给目标不给步骤，自行探索研究、端到端执行。

  - id: prometheus
    name: Prometheus
    role: planner
    default_category: ultrabrain
    needs_tools: true
    description: 战略规划师。访谈式需求分析，产出经验证的计划。从不直接写代码。

  - id: atlas
    name: Atlas
    role: orchestrator
    default_category: orchestrator
    needs_tools: true
    description: 待办执行器。读 Prometheus 的计划，按 category+skills 委派，跨任务追踪，独立验证。

  - id: oracle
    name: Oracle
    role: reviewer
    default_category: ultrabrain
    needs_tools: false
    description: 架构顾问。复杂决策、陌生模式、疑难 bug 定位。只读分析，不调工具。

  - id: metis
    name: Metis
    role: reviewer
    default_category: ultrabrain
    needs_tools: false
    description: 计划评审。检查 Prometheus 的计划是否有遗漏、可执行性。预计划 review。

  - id: momus
    name: Momus
    role: reviewer
    default_category: ultrabrain
    needs_tools: false
    description: 高精度审查。对计划/产物做严格验证，场景可执行性检查。

  - id: explore
    name: Explore
    role: searcher
    default_category: quick
    needs_tools: true
    description: 代码库快速搜索。grep / glob / 模式发现，速度优先于智能。

  - id: librarian
    name: Librarian
    role: searcher
    default_category: quick
    needs_tools: false
    description: 文档/代码检索。库示例、官方文档、远程仓库查询。

  - id: multimodal-looker
    name: Multimodal Looker
    role: vision
    default_category: visual
    needs_tools: false
    description: 视觉分析。截图、图表、PDF、设计稿理解。

  - id: sisyphus-junior
    name: Sisyphus Junior
    role: orchestrator
    default_category: quick
    needs_tools: true
    description: 轻量编排。单文件修改、typo、小重构等不需要主 Sisyphus 出马的活。
