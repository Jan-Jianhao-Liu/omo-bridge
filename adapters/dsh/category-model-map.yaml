# omo-deepseek-harness / adapters / dsh / category-model-map.yaml
#
# category → 模型路由映射（deepseek-v4-flash 版）。
# 借鉴 OMO 的 category-based routing 理念：agent 委派子任务时只说「需要 deep 类工作」，
# harness 根据本映射挑对应模型。不锁死单一供应商。
#
# 默认 agent 模型：deepseek-v4-flash（deepseek-official provider，reasoningEffort high，
# 支持 tools 调用）。本机设置见 ~/.dsh/settings.yaml 的 agent-default-model。

version: 1
default_provider: deepseek-official
default_model: deepseek-v4-flash

# category → 模型路由
routing:
  orchestrator:
    model: deepseek-v4-flash
    reasoning_effort: high
    needs_tools: true
    typical_agents: [sisyphus, atlas]

  deep:
    model: deepseek-v4-flash
    reasoning_effort: high
    needs_tools: true
    typical_agents: [hephaestus]

  quick:
    model: deepseek-v4-flash
    reasoning_effort: medium
    needs_tools: true
    typical_agents: [explore, sisyphus-junior, librarian]

  ultrabrain:
    model: deepseek-v4-flash
    reasoning_effort: high
    needs_tools: false
    typical_agents: [prometheus, oracle, metis, momus]

  visual:
    model: deepseek-v4-flash
    reasoning_effort: high
    needs_tools: false
    typical_agents: [multimodal-looker]

# 说明
notes:
  - 单一模型池（deepseek-v4-flash）时，类别差异通过 reasoning_effort 与 needs_tools 体现：
    quick 用 medium effort 提速，orchestrator/deep/ultrabrain 用 high effort 保质量。
  - needs_tools: false 的 agent（只读分析型）不暴露写工具，纯推理顾问。
  - 若未来接入多模型池，在 routing 各 category 下替换 model 即可，core 层无需改动。
